name: Sync SIMET → Supabase

on:
  schedule:
    # 00:40 UTC = 21:40 de Brasília (UTC-3) do dia anterior, logo após o dia UTC
    # fechar. O Actions costuma atrasar bastante este disparo: ver CLAUDE.md.
    - cron: '40 0 * * *'
  workflow_dispatch:        # permite rodar manualmente também

permissions:
  contents: read
  issues: write   # o alerta de falha abre/comenta uma issue

jobs:
  sync:
    runs-on: ubuntu-latest
    # a coleta levou 32 min em 30/09/2026 e o volume cresce; o teto evita um
    # runner preso pelas 6h padrão se a API travar no meio
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install @supabase/supabase-js

      - name: Rodar sincronização
        run: node sync.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # Sem isto a falha é silenciosa: a API só guarda 24h, então um dia que
      # ninguém percebeu é um dia perdido em definitivo.
      - name: Alertar em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = 'Falha na sincronização SIMET → Supabase';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const corpo = [
              `A execução de ${new Date().toISOString().slice(0, 10)} falhou.`,
              '',
              `Log: ${url}`,
              '',
              'Os dados do SIMET só ficam disponíveis por 24h. Para recuperar o dia,',
              'rode o workflow manualmente (aba Actions → Run workflow) ainda hoje.',
              'Passado esse prazo não há backfill.',
            ].join('\n');

            // uma issue por incidente: se já houver uma aberta, só comenta nela
            const abertas = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'sync-simet',
            });

            if (abertas.data.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: abertas.data[0].number,
                body: corpo,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: titulo,
                body: corpo,
                labels: ['sync-simet'],
              });
            }
